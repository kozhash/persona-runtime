<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="100%" role="img" aria-label="memory architecture">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .t { font-size: 19px; font-weight: 650; fill: #172033; }
  .l { font-size: 13.5px; font-weight: 600; fill: #172033; }
  .s { font-size: 11.5px; fill: #5b6475; }
  .m { font-size: 12px; fill: #172033; }
  .n { stroke: #64748b; stroke-width: 1.2; }
  .e { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  .ed { stroke: #64748b; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4;
        marker-end: url(#arrow); }
  .zone { fill: none; stroke: #64748b; stroke-width: 1; stroke-dasharray: 7 5; opacity: .65; }
</style>
<text class="t" x="30" y="36">Память: уровни и сон</text>
<text class="s" x="30" y="56">Слева — путь записи, в центре — граф, справа — поиск и забывание.</text>
<rect class="n" x="40" y="88" width="260" height="54" rx="8" fill="#bfdbfe"/>
<text class="l" x="52" y="108">сообщение</text>
<text class="s" x="52" y="124">текст / эмоция / событие</text>
<rect class="n" x="40" y="158" width="260" height="74" rx="8" fill="#fde68a"/>
<text class="l" x="52" y="178">episodes: labile</text>
<text class="s" x="52" y="194">E-LTP + тег, TTL 2ч</text>
<path class="e" d="M 170 142 C 170 150.0, 170 150.0, 170 158"/>
<rect class="n" x="40" y="248" width="260" height="74" rx="8" fill="#bbf7d0"/>
<text class="l" x="52" y="268">захват (PRP)</text>
<text class="s" x="52" y="284">балл ≥ auto_admit → сразу</text>
<path class="e" d="M 170 232 C 170 240.0, 170 240.0, 170 248"/>
<rect class="n" x="40" y="338" width="260" height="74" rx="8" fill="#99f6e4"/>
<text class="l" x="52" y="358">episodes: consolidated</text>
<text class="s" x="52" y="374">L-LTP, долговременная</text>
<path class="e" d="M 170 322 C 170 330.0, 170 330.0, 170 338"/>
<rect class="n" x="40" y="428" width="260" height="74" rx="8" fill="#99f6e4"/>
<text class="l" x="52" y="448">propositions</text>
<text class="s" x="52" y="464">DG: атомарные факты</text>
<path class="e" d="M 170 412 C 170 420.0, 170 420.0, 170 428"/>
<rect class="n" x="40" y="518" width="260" height="56" rx="8" fill="#99f6e4"/>
<text class="l" x="52" y="538">facts</text>
<text class="s" x="52" y="554">битемпоральные</text>
<path class="e" d="M 170 502 C 170 510.0, 170 510.0, 170 518"/>
<rect class="n" x="340" y="88" width="300" height="300" rx="8" fill="#bbf7d0"/>
<text class="l" x="352" y="108">edges (граф Хебба)</text>
<text class="s" x="352" y="144">w ← (1-λ)·w + η·I(ко-активация)</text>
<text class="s" x="352" y="163"></text>
<text class="s" x="352" y="182">типы: hebbian · synonymy</text>
<text class="s" x="352" y="201">       temporal · causal</text>
<text class="s" x="352" y="220">       prevents (отрицательный)</text>
<text class="s" x="352" y="239"></text>
<text class="s" x="352" y="258">потолок веса 3.0</text>
<text class="s" x="352" y="277">затухание за ночь</text>
<text class="s" x="352" y="296">удаляется ниже 0.01</text>
<text class="s" x="352" y="315"></text>
<text class="s" x="352" y="334">prevents = аналог ГАМК:</text>
<text class="s" x="352" y="353">гасит нерелевантные ветви</text>
<path class="ed" d="M 300 125 C 300 142.5, 340 142.5, 340 160"/>
<path class="ed" d="M 300 420 C 300 420.0, 340 420.0, 340 420"/>
<rect class="n" x="680" y="88" width="320" height="300" rx="8" fill="#c7d2fe"/>
<text class="l" x="692" y="108">поиск (два пути)</text>
<text class="s" x="692" y="144">S_base = 0.55·cos + 0.25·BM25</text>
<text class="s" x="692" y="163">         + 0.20·decay(type, age)</text>
<text class="s" x="692" y="182"></text>
<text class="s" x="692" y="201">S = S_base + β·Σ S_base·w_ij</text>
<text class="s" x="692" y="220"></text>
<text class="s" x="692" y="239">R = Top-k ∪ Top-m(flip)</text>
<text class="s" x="692" y="258"></text>
<text class="s" x="692" y="277">↓ латеральное торможение:</text>
<text class="s" x="692" y="296">почти равные скоры схлопываются</text>
<text class="s" x="692" y="315"></text>
<text class="s" x="692" y="334">находит то, что лексически</text>
<text class="s" x="692" y="353">не похоже на запрос</text>
<path class="ed" d="M 640 240 C 640 240.0, 680 240.0, 680 240"/>
<rect class="n" x="680" y="420" width="320" height="232" rx="8" fill="#e2e8f0"/>
<text class="l" x="692" y="440">затухание по типу</text>
<text class="s" x="692" y="476">ENTITY   ~60 дней</text>
<text class="s" x="692" y="495">FACT     ~30 дней</text>
<text class="s" x="692" y="514">EVENT    ~72 часа</text>
<text class="s" x="692" y="533">THOUGHT  ~12 часов</text>
<text class="s" x="692" y="552"></text>
<text class="s" x="692" y="571">практика замедляет забывание</text>
<text class="s" x="692" y="590">(spacing effect)</text>
<text class="s" x="692" y="609"></text>
<text class="s" x="692" y="628">ниже порога — в архив,</text>
<text class="s" x="692" y="647">не удаление</text>
<rect class="zone" x="40" y="672" width="960" height="56" rx="10"/>
<text class="l" x="56" y="698">СОН:  NREM (захват + реплей)  →  REM (дистилляция хабов)  →  FORGET (затухание, архив)</text>
<text class="s" x="56" y="716">каждая фаза — отдельный метод, сон идемпотентен</text>
</svg>
